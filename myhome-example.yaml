# MyHome Configuration Example
# Copy this file to myhome.yaml and customize as needed

mqtt:
  # MQTT Broker Configuration
  # This section configures the embedded Mochi MQTT broker
  broker:
    # System Configuration
    # Size of the client network write buffer in bytes
    # Default: 0 (uses Go's default bufio.Writer size)
    # client_net_write_buffer_size: 4096
    
    # Size of the client network read buffer in bytes
    # Default: 0 (uses Go's default bufio.Reader size)
    # client_net_read_buffer_size: 4096
    
    # Interval between $SYS topic updates in seconds
    # Default: 30
    # sys_topic_resend_interval: 30
    
    # Enable inline client for direct pub/sub from server code
    # Default: false (disabled to prevent confusion in statistics)
    # inline_client: false
    
    # Broker Capabilities
    # These define the features and limits available to MQTT clients
    capabilities:
      # Maximum number of seconds to keep disconnected client sessions
      # Default: 4294967295 (max uint32)
      # Recommended: 300 (5 minutes) to clean up stale subscriptions faster
      maximum_session_expiry_interval: 300
      
      # Maximum message expiry in seconds if message expiry is 0 or over
      # Default: 86400 (24 hours)
      maximum_message_expiry_interval: 86400
      
      # Maximum number of concurrent QoS 1 and 2 messages per client
      # Default: 65535
      receive_maximum: 65535
      
      # Maximum QoS value available to clients (0, 1, or 2)
      # Default: 2 (supports QoS 0, 1, and 2)
      maximum_qos: 2
      
      # Support of retain messages (0=disabled, 1=enabled)
      # Default: 1 (enabled)
      retain_available: 1
      
      # Support of wildcard subscriptions (0=disabled, 1=enabled)
      # Default: 1 (enabled)
      wildcard_sub_available: 1
      
      # Support of subscription identifiers (0=disabled, 1=enabled)
      # Default: 1 (enabled)
      sub_id_available: 1
      
      # Support of shared subscriptions (0=disabled, 1=enabled)
      # Default: 1 (enabled)
      shared_sub_available: 1
      
      # Maximum packet size in bytes (0 = no limit)
      # Default: 0
      # maximum_packet_size: 0
      
      # Maximum topic alias value (0 = no topic aliases)
      # Default: 0
      # topic_alias_maximum: 0
      
      # Minimum MQTT protocol version (3 = MQTT 3.1.1, 5 = MQTT 5.0)
      # Default: 3
      # minimum_protocol_version: 3
      
      # Maximum number of concurrent client connections (0 = unlimited)
      # Default: 0
      # maximum_clients: 0
      
      # Maximum number of inflight messages per client (0 = unlimited)
      # Default: 0
      # maximum_inflight: 0
      
      # Maximum number of pending writes per client (0 = unlimited)
      # Default: 0
      # maximum_client_writes_pending: 0

# Daemon Configuration
daemon:
  # MQTT broker address (leave empty to use embedded broker)
  # mqtt_broker: "192.168.1.2"
  
  # Initial delay before checking if embedded MQTT broker is ready
  # Gives the broker time to complete async initialization after Serve() returns
  # Default: 500ms
  # broker_readiness_initial_delay: 500ms
  
  # Timeout for waiting for embedded MQTT broker to be ready
  # Default: 30s
  # broker_readiness_timeout: 30s
  
  # mDNS lookup timeout
  # mdns_timeout: 7s
  
  # MQTT operation timeout
  # mqtt_timeout: 14s
  
  # MQTT disconnection grace period
  # mqtt_grace: 2s
  
  # Device refresh interval
  # refresh_interval: 1m
  
  # MQTT watchdog check interval
  # mqtt_watchdog_interval: 30s
  
  # MQTT watchdog max consecutive failures
  # mqtt_watchdog_max_failures: 3
  
  # MQTT periodic reconnection interval to refresh retained messages (0 to disable)
  # Useful after suspend/resume cycles to ensure latest device states
  # mqtt_reconnect_interval: 2h
  
  # MQTT broker client log interval (0 to disable)
  # mqtt_broker_client_log_interval: 2m

  # Interval for re-applying canonical MQTT broker/NTP/Matter config to known
  # devices over HTTP, as a self-healing safety net against config drift (0 to disable)
  # reconcile_interval: 1h

  # UI listen port
  # ui_port: 6080

  # Forward /devices/... to a remote myhome daemon (useful when working remotely via SSH tunnel)
  # remote_proxy: http://home-pi:6080
  
  # Enable Gen1 HTTP->MQTT proxy
  # enable_gen1_proxy: false
  
  # Enable occupancy service
  # enable_occupancy_service: true
  
  # Enable temperature service
  # enable_temperature_service: true
  
  # Disable device manager
  # disable_device_manager: false
  
  # Disable auto-setup
  # disable_auto_setup: false

# Event Log Configuration
events:
  # Path to the events SQLite database (separate from devices.db)
  # Default: ~/.myhome/events.db
  # db: ~/.myhome/events.db

  # Auto-purge threshold: events older than this duration are deleted hourly
  # Default: 2160h (90 days). Set to 0 to disable automatic purging.
  # retention: 2160h

  # Set to false to disable event recording entirely
  # Default: true
  # enabled: true

# Pool Runtime Tracking Configuration
# pool-pump.js tracks its own daily runtime/turnover and mirrors it to KVS
# (script/pool-pump/runtime-sec, script/pool-pump/turnover-today); the daemon
# just reads those values back for `ctl pool status` and the
# pool.turnover_today notice — no separate pool database.
#
# Solar-driven pump control also lives entirely in pool-pump.js now (it
# subscribes to myhome/energy/solar/available, published below by the solar
# aggregator, and applies its own KVS-configured hysteresis — see
# docs/pool-pump.md for the script/pool-pump/solar-* keys). There is no
# daemon-side pool.solar.* config anymore.
pool:
  # Shelly device ID for the pool pump
  # Example: shellyplus1pm-aabbccddeeff
  # device_id: "aabbccddeeff"

  # Set to true to enable pool runtime tracking
  # Default: false
  # enabled: false

# Beem Energy: set email and password to enable solar production polling.
# Integration is enabled automatically when both values are non-empty.
beem:
  email:         "you@example.com"
  password:      "secret"
  poll_interval: 60s

# Solar aggregator: sums whatever solar-energy sources are known (today: only
# Beem) and republishes the total, retained, to myhome/energy/solar/available
# for Shelly device scripts (e.g. pool-pump.js) to subscribe to directly.
# Starts automatically once at least one source is configured — no separate
# enable flag. Not pool-specific: has no dependency on pool.device_id.
solar:
  # A source's last reading older than this is excluded from the total, but
  # doesn't block other, fresher sources from being summed.
  # Default: 5m
  # stale_after: 5m

# SFR box credentials — used to authenticate when the box requires a password.
# Leave empty to skip authentication (works for boxes with no password policy).
sfr:
  username: ""
  password: ""

# Notice service: curates a "notice" event severity (daily pool/garden plans,
# solar pump on/off, motion at night or while absent) and emails a daily
# digest. Unlike events/occupancy/temperature, this is NOT auto-enabled with
# the device manager — it requires the events and occupancy services to
# already be running, so set enabled: true explicitly once those are on.
notice:
  # Default: false
  # enabled: true

  # Night window (HH:MM, 24h) used by the motion notice rule; wraps past midnight.
  # Default: 22:00 / 06:00
  # night_start: "22:00"
  # night_end:   "06:00"

  # Local hour (0-23) at which the daily digest email is sent.
  # Default: 8
  # digest_hour: 8

# Outbound email (SMTP) for the notice digest. Only host/port belong here —
# username/password/from/to are credentials and are read from the .env file
# (MYHOME_SMTP_*), written by `dpkg-reconfigure myhome`, never from this file.
# Sending is silently skipped (not an error) whenever smtp.from is empty.
smtp:
  host: "smtp.gmail.com"
  port: 587
